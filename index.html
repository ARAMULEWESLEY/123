<!doctype html>
<html lang="en">
  <head>
    <!-- BASIC -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- TITLE (ENTITY + KEYWORDS) -->
    <title>
      Steadfast Enterprises Limited | Sachet & Mozzarella Cheese Manufacturer | Uganda & East Africa
    </title>

    <!-- META DESCRIPTION -->
    <meta
      name="description"
      content="Steadfast Enterprises Limited is a Uganda-based manufacturer of branded and unbranded sachets including sugar, ginger, honey, and coffee, as well as mozzarella cheese. Located on Kitetika–Gayaza Road, serving Uganda and East Africa."
    />

    <!-- AUTHOR -->
    <meta name="author" content="Steadfast Enterprises Limited" />

    <!-- KEYWORDS (SUPPORTING CONTEXT) -->
    <meta
      name="keywords"
      content="Steadfast Enterprises Limited, sachet manufacturing Uganda, sugar sachets, ginger sachets, honey sachets, coffee sachets, mozzarella cheese manufacturer Uganda, FMCG packaging East Africa"
    />

    <!-- CANONICAL (VERY IMPORTANT) -->
    <link rel="canonical" href="https://steadfastenterprises.co.ug/" />

    <!-- OPEN GRAPH -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Steadfast Enterprises Limited | FMCG & Dairy Manufacturing Uganda"
    />
    <meta
      property="og:description"
      content="Manufacturer of branded and unbranded sachets (sugar, ginger, honey, coffee) and mozzarella cheese serving Uganda and East Africa."
    />
    <meta property="og:url" content="https://steadfastenterprises.co.ug/" />
    <meta
      property="og:image"
      content="https://steadfastenterprises.co.ug/og-image.jpg"
    />

    <!-- TWITTER -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Steadfast Enterprises Limited | Manufacturing Excellence Uganda"
    />
    <meta
      name="twitter:description"
      content="Trusted manufacturer of sachet packaging and mozzarella cheese serving East Africa."
    />
    <meta
      name="twitter:image"
      content="https://steadfastenterprises.co.ug/og-image.jpg"
    />

    <!-- GEO TARGETING -->
    <meta name="geo.region" content="UG" />
    <meta name="geo.placename" content="Kitetika–Gayaza Road, Uganda" />
    <meta name="language" content="English" />

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- STRUCTURED DATA (AI + GOOGLE ENTITY SIGNAL) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Steadfast Enterprises Limited",
        "url": "https://steadfastenterprises.co.ug",
        "logo": "https://steadfastenterprises.co.ug/logo.png",
        "description": "Manufacturer of branded and unbranded sachets (sugar, ginger, honey, coffee) and mozzarella cheese serving Uganda and East Africa.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Kitetika–Gayaza Road",
          "addressCountry": "UG"
        },
        "areaServed": [
          "Uganda",
          "Kenya",
          "Tanzania",
          "Rwanda",
          "East Africa"
        ],
        "industry": [
          "Food Manufacturing",
          "FMCG Packaging",
          "Dairy Manufacturing"
        ]
      }
    </script>
  </head>

  <body>
    <!-- SEO + ACCESSIBILITY FALLBACK -->
    <noscript>
      Steadfast Enterprises Limited manufactures branded and unbranded sachets
      including sugar, ginger, honey, and coffee, as well as mozzarella cheese.
      Serving Uganda and East Africa from Kitetika–Gayaza Road.
    </noscript>

    <!-- REACT ROOT -->
    <div id="root"></div>

    <!-- APP ENTRY -->
    <script type="module" src="/src/main.tsx"></script>

</html>
